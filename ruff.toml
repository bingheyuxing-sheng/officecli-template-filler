# Ruff lint policy for the officecli-template-filler skill.
#
# `scripts/*.py` are standalone CLI entrypoints, not an installed package. Each
# one must prepend the repository root to `sys.path` before it can import the
# in-repo `engine` package, which puts every `from engine import ...` import
# after an executable statement. E402 is the expected consequence of that
# bootstrap, not a defect, so it is waived for that directory only.
#
# Everything else is checked normally. `zip(..., strict=)` is enforced by B905:
# comparisons across two different documents use `strict=False` on purpose
# (length differences are reported separately as their own issue codes), while
# same-document or guarded comparisons use `strict=True`.
target-version = "py310"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "B"]

[lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]
